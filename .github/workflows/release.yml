# Copy to .github/workflows/release.yml in a product repo and fill the inputs
# from inventory/products.tsv (install_slug, freemius_id).
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+"

jobs:
  release:
    uses: Themekraft/release-tooling/.github/workflows/release.yml@main
    with:
      slug: buddyforms
      freemius-id: "391"
      main-file: BuddyForms.php
      wporg: true
    secrets: inherit
