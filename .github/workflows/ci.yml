# Copy to .github/workflows/ci.yml in a product repo.
name: ci

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  ci:
    uses: Themekraft/release-tooling/.github/workflows/ci.yml@main
    with:
      slug: buddyforms
      plugin-check: true
      # Plugin Check still reports a known backlog of errors (escaping, prepared SQL,
      # cURL, heredocs); it reports without blocking until that work lands.
      plugin-check-blocking: false
    secrets: inherit
